[DEFAULT]
# On sw-hot use 172.30.201.248 — on sw-cold use 172.30.201.249
bind_ip = 0.0.0.0
bind_port = 6202
workers = 2
user = swift
swift_dir = /etc/swift
devices = /srv/node
mount_check = false
disable_fallocate = true
log_facility = LOG_LOCAL2

[pipeline:main]
pipeline = healthcheck recon account-server

[app:account-server]
use = egg:swift#account

[filter:healthcheck]
use = egg:swift#healthcheck

[filter:recon]
use = egg:swift#recon

[account-replicator]

[account-auditor]

[account-reaper]
